name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from main
        required: true
        type: string
      source_only:
        description: Recover the GitHub source release without publishing to npm
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Qualify a version change on main or an explicit source-only recovery.
  qualify-github-source:
    name: Qualify GitHub source release
    if: github.event_name == 'pull_request' || (github.repository == 'nanoodlecom/mp4cat' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.qualify.outputs.source_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - name: Compare the packaged version with the prior main commit
        id: qualify
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_ONLY: ${{ inputs.source_only }}
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/source-pack.json"
          node .github/scripts/publish_source.mjs qualify "$RUNNER_TEMP/source-pack.json" >> "$GITHUB_OUTPUT"

  publish-github-source:
    name: Publish tested GitHub source release
    if: >-
      github.repository == 'nanoodlecom/mp4cat' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.source_only)) &&
      needs.qualify-github-source.outputs.version != '' &&
      needs.qualify-github-source.outputs.version == needs.package.outputs.version
    needs: [qualify-github-source, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-source-${{ needs.qualify-github-source.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
      - name: Tag and release the tested source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_ONLY: ${{ inputs.source_only }}
          SOURCE_VERSION: ${{ needs.package.outputs.version }}
        run: node .github/scripts/publish_source.mjs publish "$SOURCE_VERSION"

  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - node: '22.23.5'
            image: node:22.23.5-alpine3.23@sha256:6868d4695b947ee120bffaa463fecd68cde370d7bfec92955e7c8ac576b4f475
          - node: '24.22.3'
            image: node:24.22.3-alpine3.24@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
          - node: '26.13.1'
            image: node:26.13.1-alpine3.24@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test with FFmpeg and FFprobe
        shell: bash
        env:
          NODE_IMAGE: ${{ matrix.image }}
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          git archive HEAD | docker run --rm -i -e EXPECTED_NODE "$NODE_IMAGE" sh -ec '
            test "$(node --version)" = "v$EXPECTED_NODE"
            apk add --no-cache ffmpeg
            ffmpeg -version
            ffprobe -version
            mkdir -p /tmp/mp4cat
            tar -xf - -C /tmp/mp4cat
            cd /tmp/mp4cat
            npm ci
            npm test
          '

  package:
    name: Pack tested npm distribution
    if: >-
      github.event_name == 'pull_request' ||
      (github.repository == 'nanoodlecom/mp4cat' && github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' || needs.qualify-github-source.outputs.version != ''))
    needs: [test, qualify-github-source]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Pack and validate the release archive
        id: pack
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.qualify-github-source.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/distribution"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/distribution" > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, renameSync } from 'node:fs';
          import { join } from 'node:path';
          const { RUNNER_TEMP, GITHUB_OUTPUT, GITHUB_EVENT_NAME, EXPECTED_VERSION } = process.env;
          const [packed] = JSON.parse(readFileSync(join(RUNNER_TEMP, 'pack.json'), 'utf8'));
          if (packed.name !== 'mp4cat' || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(packed.version) ||
              packed.filename !== `mp4cat-${packed.version}.tgz`) {
            throw new Error('Unexpected npm package metadata');
          }
          if (GITHUB_EVENT_NAME !== 'pull_request' && packed.version !== EXPECTED_VERSION) {
            throw new Error('The requested release version differs from the tested package');
          }
          renameSync(join(RUNNER_TEMP, 'distribution', packed.filename), join(RUNNER_TEMP, 'distribution', 'package.tgz'));
          appendFileSync(GITHUB_OUTPUT, `version=${packed.version}\n`);
          JS
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/distribution/package.tgz
          if-no-files-found: error

  publish:
    name: Publish tested npm distribution
    if: >-
      github.repository == 'nanoodlecom/mp4cat' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.source_only))
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    environment:
      name: npm
      url: https://www.npmjs.com/package/mp4cat/v/${{ needs.package.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-distribution
      - name: Publish version if absent from npm
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          registry_url="https://registry.npmjs.org/mp4cat/$VERSION"
          registry_metadata="$RUNNER_TEMP/registry.json"
          archive_integrity="sha512-$(openssl dgst -sha512 -binary package.tgz | openssl base64 -A)"
          verify_registry_archive() {
            if ! jq -e --arg version "$VERSION" --arg integrity "$archive_integrity" \
              '.name == "mp4cat" and .version == $version and .dist.integrity == $integrity' \
              "$registry_metadata" >/dev/null; then
              echo "npm metadata for mp4cat@$VERSION does not match the tested archive" >&2
              return 1
            fi
          }
          status="$(curl --silent --show-error --retry 2 --max-time 30 \
            --output "$registry_metadata" --write-out '%{http_code}' "$registry_url")"
          case "$status" in
            200)
              verify_registry_archive
              echo "The tested mp4cat@$VERSION archive is already published"
              ;;
            404)
              flags=()
              if [[ "$VERSION" == *-* ]]; then flags+=(--tag next); fi
              npm publish ./package.tgz --ignore-scripts --access public "${flags[@]}"
              # npm can acknowledge a publish before the version is visible to reads.
              curl --fail --silent --show-error --retry 36 --retry-all-errors --retry-delay 5 \
                --retry-max-time 180 --max-time 10 --output "$registry_metadata" "$registry_url"
              verify_registry_archive
              ;;
            *) echo "npm version lookup returned HTTP $status" >&2; exit 1 ;;
          esac
