name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22.23.4", "24.22.1", "26.12.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Test fixtures are generated at test time with ffmpeg/ffprobe; without
      # them the fixture-based tests self-skip. Install so the full suite runs.
      - name: Ensure FFmpeg is available
        timeout-minutes: 3
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm ci
      - run: npm test
